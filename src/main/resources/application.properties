# ===============================
# Application Core Configuration
# ===============================
spring.application.name=autocode-agent-platform

# Server port changed from 8080 to 9090
server.port=9090

# ===============================
# Database Configuration (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/employee_schema?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=batch_user
spring.datasource.password=MySql@5050
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Spring Batch Configuration
# ===============================
spring.batch.job.enabled=true
spring.batch.initialize-schema=always

# ===============================
# Swagger / OpenAPI Configuration
# ===============================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# Logging Configuration
# ===============================
logging.level.org.springframework=INFO
logging.level.com.autocode.platform=DEBUG
